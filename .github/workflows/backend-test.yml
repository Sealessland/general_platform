name: Backend Test

on:
  workflow_call:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: redcart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U postgres -d redcart_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=10s
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      kafka:
        image: apache/kafka:4.3.1
        env:
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:19092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:19093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        ports:
          - 19092:19092
        options: >-
          --health-cmd="/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:19092 --list"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Backend CI
        env:
          POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/redcart_test?sslmode=disable
          REDIS_ADDR: 127.0.0.1:6379
          KAFKA_BROKERS: 127.0.0.1:19092
          KAFKA_TOPIC: redcart.events.ci
          RUN_POSTGRES_INTEGRATION: "1"
        run: bash ci/scripts/backend-ci.sh
      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-artifacts
          path: |
            backend/coverage.out
            ci/artifacts/backend-test.txt
            ci/artifacts/backend-test-list.txt
            ci/artifacts/backend-coverage-functions.txt
            ci/artifacts/backend-coverage-summary.txt
            ci/artifacts/backend-test-metrics.json
            ci/artifacts/backend-postgres-integration.txt
            ci/artifacts/backend-postgres-http-integration.txt
            ci/artifacts/backend-postgres-http-benchmark.txt
            ci/artifacts/backend-postgres-http-qps.txt
            ci/artifacts/backend-kafka-benchmark.txt
            ci/artifacts/backend-kafka-qps.txt
