name: Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: redcart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d redcart_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      kafka:
        image: apache/kafka:4.3.1
        env:
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:19092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:19093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        ports:
          - 19092:19092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:19092 --list"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run benchmarks
        working-directory: backend
        env:
          POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/redcart_test?sslmode=disable
          REDIS_ADDR: 127.0.0.1:6379
          JWT_SECRET: this-value-is-public-and-used-only-by-ci
          KAFKA_BROKERS: 127.0.0.1:19092
          KAFKA_TOPIC: redcart.events.bench
          RUN_POSTGRES_INTEGRATION: "1"
        run: |
          set -euo pipefail
          go test ./internal/redcart/interfaces/httpapi ./internal/event/outbox ./internal/event/kafka \
            -run '^$' \
            -bench 'BenchmarkHTTPPostgresOrderPreview|BenchmarkHTTPPostgresCreateOrder|BenchmarkHTTPPostgresCreateOrderWithOutbox|BenchmarkPostgresKafkaOutboxRelay|BenchmarkKafkaPublish' \
            -benchtime=1s \
            -benchmem \
            -count=1 \
            | tee benchmark.txt

          HTTP_PORT=18080 go run ./cmd/api > /tmp/redcart-benchmark-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz >/dev/null

          LIVE_HTTP_BASE_URL=http://127.0.0.1:18080 \
            go test ./internal/redcart/interfaces/httpapi \
              -run '^$' \
              -bench 'BenchmarkLiveHTTP(Healthz|OrderPreview|CreateOrder)$' \
              -benchtime=1s \
              -benchmem \
              -count=1 \
              | tee -a benchmark.txt

      - name: Update README with benchmark results
        run: python3 ci/scripts/update-benchmark-readme.py < backend/benchmark.txt

      - name: Publish benchmark summary
        run: |
          sed -n '/<!-- BENCHMARK_RESULTS_START -->/,/<!-- BENCHMARK_RESULTS_END -->/p' README.md \
            | sed '1d;$d' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            backend/benchmark.txt
            README.md

      - name: Commit benchmark results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update benchmark results [skip ci]"
          file_pattern: README.md
          branch: main
