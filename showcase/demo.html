<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="RedCart Copilot 商店演示：无后端单文件 demo，覆盖消费者购买闭环、商家看板与 A2UI 智能导购。">
<title>RedCart Copilot · 商店演示（无后端单文件 Demo）</title>
<!--
  RedCart Copilot 商店演示（showcase/demo.html）

  这是一个【无后端、零网络依赖】的单文件演示：双击即可在浏览器中运行，
  不请求任何网络资源（商品封面使用本地渐变占位图，不使用外部 CDN/字体）。

  所有展示事实均取自仓库真实文件：
  - 商品/SKU/笔记/订单/行为事件 seed 数据：backend/internal/redcart/infrastructure/postgres/migrate.go（seedSQL）
  - 表结构与金额单位（分）：backend/migrations/0001_init_schema.sql
  - 交互流程与状态机：frontend/src/app.ts（订单状态枚举、SKU 选择、购物车、结算、幂等下单、
    订单详情三面板、商家看板、A2UI 渲染器均按 app.ts 行为移植）
  - A2UI 指令结构与上下文富化：backend/internal/ai/mock_provider.go、
    backend/internal/redcart/application/service_ai.go（预算解析/场景推断/商品筛选）

  说明：
  - 数据为仓库 seed 的 mock 数据；购物车/订单/幂等键持久化在浏览器 localStorage。
  - 商品标题与卖点为 seed 原文（英文），页面展示的「丝绒唇泥套装」等为演示译名，仅作 UI 文案。
  - seed cover_url 指向 images.example.com 占位域名，本 demo 为保证离线可用改渲染本地渐变占位图。
  - 与后端 mock_provider.normalizeProducts 一致，A2UI 数据模型中的 sku_id 简化为商品 id；
    演示在渲染层把「商品 id 型 sku_id」安全映射到该商品首个在售 SKU，避免加购错误 SKU。

  交互闭环：商品列表 → 详情(SKU/库存) → 购物车 → 结算(幂等下单) → 订单(状态机)；
  商家视角：经营看板(seed 漏斗/GMV) + 商品只读列表；AI 导购：意图 → NDJSON 指令流 → 实时渲染。
-->
<style>
  :root {
    --bg: #eef4fa;
    --panel: #ffffff;
    --border: #d5e1ee;
    --ink: #12283f;
    --muted: #5f738b;
    --primary: #0e7490;
    --primary-2: #0891b2;
    --accent: #22d3ee;
    --accent-soft: #e0f7fb;
    --navy: #0d1b2e;
    --navy-2: #14283f;
    --danger: #d33a4f;
    --ok: #0f9d58;
    --warn: #b45309;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(13, 27, 46, .08), 0 4px 14px rgba(13, 27, 46, .06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.6;
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* 顶栏 */
  .topbar {
    background: linear-gradient(100deg, var(--navy) 0%, var(--navy-2) 55%, #0e3a52 100%);
    color: #e6f4fb;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 22px; gap: 12px; flex-wrap: wrap;
    box-shadow: 0 2px 10px rgba(13, 27, 46, .25);
    position: sticky; top: 0; z-index: 20;
  }
  .top-left { display: flex; align-items: center; gap: 10px; }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: .2px; color: #fff; }
  .brand .dot { color: var(--accent); }
  .role-tag {
    font-size: 12px; padding: 2px 10px; border-radius: 999px;
    background: rgba(34, 211, 238, .16); color: #a5f3fc;
    border: 1px solid rgba(34, 211, 238, .35);
  }
  .top-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .account { font-size: 12px; color: #b6cde0; margin-right: 4px; }

  /* 按钮 */
  .btn {
    font: inherit; cursor: pointer; border: 1px solid var(--border);
    background: #fff; color: var(--ink);
    border-radius: 8px; padding: 5px 14px;
    transition: all .15s ease;
  }
  .btn:hover { border-color: var(--primary-2); color: var(--primary-2); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-2); color: #fff; }
  .btn.danger { color: var(--danger); border-color: #f3c1c7; }
  .btn.danger:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.mini { padding: 2px 10px; font-size: 12px; border-radius: 6px; }
  .btn.ghost { background: transparent; border-color: rgba(255,255,255,.35); color: #e6f4fb; }
  .btn.ghost:hover { border-color: #fff; color: #fff; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.link { border: none; background: none; color: var(--primary); padding: 0 2px; }
  .btn.link:hover { text-decoration: underline; color: var(--primary-2); }

  /* 布局 */
  .layout { display: flex; flex: 1; }
  .nav {
    width: 172px; flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 14px 8px; display: flex; flex-direction: column; gap: 4px;
  }
  .nav a {
    display: block; padding: 8px 12px; border-radius: 8px;
    color: var(--muted); text-decoration: none; font-size: 13.5px;
    border: 1px solid transparent;
  }
  .nav a:hover { background: var(--accent-soft); color: var(--primary); }
  .nav a.active { background: var(--accent-soft); color: var(--primary); border-color: #bdeaf5; font-weight: 600; }
  .nav .badge-pill {
    display: inline-block; min-width: 18px; text-align: center; font-size: 11px;
    background: var(--primary); color: #fff; border-radius: 999px; margin-left: 6px; padding: 0 5px;
  }
  .main { flex: 1; padding: 20px 26px 40px; max-width: 1120px; }

  .notice {
    padding: 9px 14px; border-radius: 10px; margin-bottom: 14px;
    font-size: 13px; border: 1px solid;
  }
  .notice.ok { background: #e9f9ef; border-color: #bfe8cf; color: #166534; }
  .notice.info { background: #e6f4fe; border-color: #bcdbf5; color: #1d4ed8; }
  .notice.error { background: #fdecef; border-color: #f5c2ca; color: #b91c1c; }

  .page-head { margin-bottom: 16px; }
  .page-head h1 { margin: 0 0 2px; font-size: 22px; color: var(--ink); }
  .page-head p { margin: 0; color: var(--muted); font-size: 13px; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .meta { color: var(--muted); font-size: 12.5px; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; box-shadow: var(--shadow); overflow-x: auto; }
  .panel.soft { background: #f8fbfd; }
  .panel h2, .panel h3 { margin: 0 0 10px; }
  .panel h2 { font-size: 17px; }
  .panel h3 { font-size: 15px; }
  .panel p { margin: 4px 0; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 14px; }
  .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 880px) { .cols-2, .cols-3 { grid-template-columns: 1fr; } .nav { width: 100%; flex-direction: row; flex-wrap: wrap; } .layout { flex-direction: column; } }

  /* 商品封面：本地渐变占位图（离线可用） */
  .cover {
    height: 128px; border-radius: 10px; position: relative; overflow: hidden;
    display: flex; align-items: flex-end; padding: 10px 12px;
    color: rgba(255, 255, 255, .95); font-weight: 700; font-size: 18px;
    letter-spacing: 2px; text-shadow: 0 1px 4px rgba(0, 0, 0, .25);
  }
  .cover.g1 { background: linear-gradient(135deg, #0e7490, #22d3ee); }
  .cover.g2 { background: linear-gradient(135deg, #2563eb, #38bdf8); }
  .cover.g3 { background: linear-gradient(135deg, #312e81, #22d3ee); }
  .cover.g4 { background: linear-gradient(135deg, #0f766e, #2dd4bf); }
  .cover.g5 { background: linear-gradient(135deg, #1e3a8a, #0ea5e9); }
  .cover .cover-tag { position: absolute; top: 8px; right: 10px; font-size: 11px; font-weight: 400; background: rgba(13, 27, 46, .35); border-radius: 6px; padding: 1px 7px; letter-spacing: 0; text-shadow: none; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: inherit; font-size: 12px; padding: 2px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: #f6fafd; color: var(--muted); cursor: pointer;
  }
  .chip:hover { color: var(--primary); border-color: var(--primary-2); }
  .chip.static { cursor: default; background: var(--accent-soft); border-color: #c9eef6; color: var(--primary); }

  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }

  table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tbl th, table.tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.tbl th { color: var(--muted); font-weight: 600; font-size: 12px; background: #f6fafd; }
  table.tbl tr:last-child td { border-bottom: none; }
  .mini-input { width: 62px; font: inherit; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; }
  input[type="text"], input[type="number"], input[type="password"], select, textarea {
    font: inherit; padding: 6px 9px; border: 1px solid var(--border); border-radius: 8px;
    background: #fff; color: var(--ink); width: 100%;
  }
  select { width: auto; }
  textarea { resize: vertical; min-height: 64px; }
  .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .form-row .label { font-size: 12px; color: var(--muted); }

  .badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 11.5px; border: 1px solid; white-space: nowrap; }
  .badge.created   { background: #fef3c7; color: #b45309; border-color: #f5d489; }
  .badge.paid      { background: #dbeafe; color: #1d4ed8; border-color: #bcd7fb; }
  .badge.shipped   { background: #cffafe; color: #0e7490; border-color: #9be1f2; }
  .badge.finished  { background: #dcfce7; color: #15803d; border-color: #b3e8c5; }
  .badge.cancelled { background: #e2e8f0; color: #64748b; border-color: #ccd6e0; }
  .badge.refunding { background: #ffedd5; color: #c2410c; border-color: #f7d2a8; }
  .badge.refunded  { background: #f3e8ff; color: #7e22ce; border-color: #e3cdf5; }

  .empty, .error { padding: 22px 14px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius); background: #fafcfe; }
  .error { color: var(--danger); border-color: #f3c1c7; background: #fdf5f6; }

  .summary-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .summary-money { font-size: 18px; font-weight: 700; color: var(--primary); }

  /* 指标卡 */
  .metric { gap: 2px; }
  .metric-label { font-size: 12px; color: var(--muted); }
  .metric-value { font-size: 24px; font-weight: 700; color: var(--ink); }
  .metric .muted { margin-top: 2px; }

  /* 漏斗行（条形宽度与各阶段事件数成比例，右侧标注转化率/退款率） */
  .funnel-row { display: grid; grid-template-columns: 118px minmax(0, 1fr) 52px 56px; align-items: center; gap: 10px; padding: 7px 0; font-size: 13px; }
  .funnel-row .fk { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 12px; background: #e7eef6; border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--primary-2), var(--accent)); }
  .funnel-row .fv { text-align: right; font-variant-numeric: tabular-nums; }
  .funnel-row .frate { text-align: right; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* 商品 GMV 占比条形 */
  .gmv-cell { min-width: 148px; }
  .gmv-bar { height: 8px; background: #e7eef6; border-radius: 999px; overflow: hidden; margin-top: 3px; }
  .gmv-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--primary), var(--primary-2)); }

  /* 订单状态步骤条：主路径 CREATED→PAID→SHIPPED→FINISHED，含 CANCELLED/REFUNDING 分支 */
  .step-track { display: flex; align-items: flex-start; overflow-x: auto; padding: 8px 2px 2px; }
  .step-node { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 76px; }
  .step-dot { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; border: 2px solid; background: #fff; }
  .step-node.done .step-dot { background: var(--primary); border-color: var(--primary); color: #fff; }
  .step-node.current .step-dot { background: var(--accent-soft); border-color: var(--primary); color: var(--primary); box-shadow: 0 0 0 3px rgba(14, 116, 144, .15); }
  .step-node.upcoming .step-dot { border-color: var(--border); color: #b7c6d6; }
  .step-node.branch-cancelled.current .step-dot { background: #fdecef; border-color: var(--danger); color: var(--danger); box-shadow: 0 0 0 3px rgba(211, 58, 79, .15); }
  .step-node.branch-refunding.current .step-dot { background: #ffedd5; border-color: #c2410c; color: #c2410c; box-shadow: 0 0 0 3px rgba(194, 65, 12, .15); }
  .step-node.branch-refunded.current .step-dot { background: #f3e8ff; border-color: #7e22ce; color: #7e22ce; box-shadow: 0 0 0 3px rgba(126, 34, 206, .15); }
  .step-node.branch.done .step-dot { background: #e9f9ef; border-color: var(--ok); color: var(--ok); }
  .step-label { font-size: 12px; color: var(--ink); text-align: center; line-height: 1.3; white-space: nowrap; }
  .step-code { font-size: 10px; color: var(--muted); text-align: center; letter-spacing: .2px; white-space: nowrap; }
  .step-link { flex: 1 1 18px; min-width: 14px; height: 2px; background: var(--border); margin-top: 12px; }
  .step-link.done { background: var(--primary-2); }

  /* 分支态行：独立于主路径展示，窄屏可换行 */
  .step-branch { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); flex-wrap: wrap; }
  .step-branch .step-node { width: auto; }
  .step-branch-arrow { color: var(--muted); font-size: 13px; }
  .step-branch-mark { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; flex-shrink: 0; }
  .step-branch-note { font-size: 12px; }

  /* 终端式 NDJSON 输出 */
  .terminal {
    background: #0b1524; color: #9fd7f5; border-radius: 10px;
    padding: 12px 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; overflow-x: auto; margin-top: 10px;
  }
  .term-line { border-left: 2px solid #1e4d6b; padding: 2px 0 8px 10px; margin-bottom: 8px; }
  .term-line.applied { border-left-color: #22d3ee; }
  .term-meta { color: #7fa9c4; margin-bottom: 3px; }
  .term-tag { float: right; color: #4c7d9e; font-size: 11px; }
  .term-line pre { margin: 0; white-space: pre-wrap; word-break: break-all; color: #b8e2fb; }
  .term-status { color: #22d3ee; font-size: 12px; margin-top: 6px; }

  /* A2UI surface 渲染 */
  .a2ui-surface { margin-top: 10px; }
  .a2ui-card { border: 1px solid #bfe0ef; border-left: 4px solid #00BFFF; }
  .a2ui-column { display: flex; flex-direction: column; gap: 8px; }
  .a2ui-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .a2ui-list { display: flex; flex-direction: column; gap: 10px; }
  .a2ui-text { color: var(--ink); }
  .a2ui-text.h2 { font-size: 17px; font-weight: 700; }
  .a2ui-text.h3 { font-size: 15px; font-weight: 600; }
  .a2ui-image { width: 100%; height: 110px; border-radius: 8px; object-fit: cover; }
  .a2ui-slider-wrap { display: flex; align-items: center; gap: 8px; }
  .a2ui-slider-wrap input[type="range"] { width: 160px; accent-color: #00BFFF; }
  .a2ui-slider-label { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .idem-panel { border: 1px dashed #9bd7e8; background: #f2fbfd; border-radius: 10px; padding: 10px 14px; margin-top: 10px; font-size: 12.5px; }
  .foot { margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  .json-pre { background: #f6fafd; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }

  /* 移动端（须置于所有基础规则之后，否则会被源顺序覆盖） */
  @media (max-width: 480px) {
    .main { padding: 14px 12px 32px; }
    .topbar { padding: 8px 12px; }
    .funnel-row { grid-template-columns: 92px minmax(0, 1fr) 40px 46px; gap: 6px; }
    .step-node { width: 62px; }
    .step-link { min-width: 10px; }
    .gmv-cell { min-width: 132px; }
  }
</style>
</head>
<body>
<div id="app"></div>

// 把「分」格式化为人民币字符串，与 frontend/src/app.ts formatMoney 一致
function formatMoney(cents) {
  if (!Number.isInteger(cents)) { throw new Error("amount must be integer cents"); }
  return "¥" + (cents / 100).toFixed(2);
}
// 分 → 元字符串（两位小数），供 A2UI 数据模型展示价格
function fmtYuan(cents) { return (cents / 100).toFixed(2); }
// 时间格式化：空值显示 "-"，非法时间原样返回，合法时间按 zh-CN 本地化
function prettyTime(value) {
  if (!value) return "-";
  var d = new Date(value);
  if (Number.isNaN(d.getTime())) return String(value);
  return d.toLocaleString("zh-CN");
}
// 计算 n 小时前的 ISO 时间戳，用于 seed 订单时间偏移
function hoursAgo(h) { return new Date(Date.now() - h * 3600 * 1000).toISOString(); }

// 按 id 查找商品，未找到返回 null
function findProduct(id) {
  for (var i = 0; i < MOCK_PRODUCTS.length; i++) {
    if (MOCK_PRODUCTS[i].id === Number(id)) return MOCK_PRODUCTS[i];
  }
  return null;
}
// 通过 SKU id 反查所属商品（SKU 未冗余 product_id 字段，按 seed 的归属关系扫描）
function findProductBySku(skuId) {
  for (var i = 0; i < MOCK_PRODUCTS.length; i++) {
    var skus = MOCK_PRODUCTS[i].skus;
    for (var j = 0; j < skus.length; j++) {
      if (skus[j].id === Number(skuId)) return MOCK_PRODUCTS[i];
    }
  }
  return null;
}
// 按 id 全局查找 SKU（跨商品扫描），未找到返回 null
function findSku(skuId) {
  for (var i = 0; i < MOCK_PRODUCTS.length; i++) {
    var skus = MOCK_PRODUCTS[i].skus;
    for (var j = 0; j < skus.length; j++) {
      if (skus[j].id === Number(skuId)) return skus[j];
    }
  }
  return null;
}

// 起售价（最低价）与可售库存（stock - locked_stock），与 app.ts calcProductPrice/calcProductStock 一致
function productMinPrice(product) {
  var skus = product.skus || [];
  if (!skus.length) return 0;
  var min = 0;
  for (var i = 0; i < skus.length; i++) {
    if (!min || skus[i].price_cent < min) min = skus[i].price_cent;
  }
  return min;
}
function productStock(product) {
  var skus = product.skus || [];
  var sum = 0;
  for (var i = 0; i < skus.length; i++) sum += Math.max(0, skus[i].stock - skus[i].locked_stock);
  return sum;
}
// SKU 可售库存 = stock - locked_stock（下限 0）
function skuAvailable(sku) { return Math.max(0, sku.stock - sku.locked_stock); }

var LS_KEY = {
  role: "redcart_demo_role_v1",
  cart: "redcart_demo_cart_v1",
  orders: "redcart_demo_orders_v1",
  idem: "redcart_demo_idem_v1",
};

// 从 localStorage 读取并 JSON 反序列化，异常或环境不支持时返回默认值
function lsGet(key, fb) {
  try {
    if (typeof localStorage === "undefined") return fb;
    var raw = localStorage.getItem(key);
    return raw == null ? fb : JSON.parse(raw);
  } catch (e) { return fb; }
}
// 将值 JSON 序列化后写入 localStorage，异常时静默忽略（如隐私模式）
function lsSet(key, val) {
  try {
    if (typeof localStorage === "undefined") return;
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) { /* 隐私模式等场景下忽略 */ }
}

var state = {
  role: lsGet(LS_KEY.role, "consumer"),
  cart: null,
  orders: null,
  idem: null,
};

// 加载购物车：内存缓存 + localStorage 兜底，首次为空则写入 seed
function loadCart() {
  if (state.cart == null) {
    state.cart = lsGet(LS_KEY.cart, null);
    if (state.cart == null) { state.cart = seedCartItems(); saveCart(); }
  }
  return state.cart;
}
// 加载订单列表：内存缓存 + localStorage 兜底，首次为空则写入 seed
function loadOrders() {
  if (state.orders == null) {
    state.orders = lsGet(LS_KEY.orders, null);
    if (state.orders == null) { state.orders = seedOrders(); saveOrders(); }
  }
  return state.orders;
}
// 加载幂等键 → 订单 id 映射表（内存缓存 + localStorage 兜底）
function loadIdem() {
  if (state.idem == null) {
    state.idem = lsGet(LS_KEY.idem, {});
  }
  return state.idem;
}
// 持久化购物车到 localStorage
function saveCart() { lsSet(LS_KEY.cart, state.cart); }
// 持久化订单列表到 localStorage
function saveOrders() { lsSet(LS_KEY.orders, state.orders); }
// 持久化幂等键映射表到 localStorage
function saveIdem() { lsSet(LS_KEY.idem, state.idem); }
// 持久化当前角色（消费者/商家）
function saveRole() { lsSet(LS_KEY.role, state.role); }

// 生成下一个购物车条目 id（当前最大 id + 1）
function nextCartId() {
  var max = 0;
  loadCart().forEach(function (i) { if (i.id > max) max = i.id; });
  return max + 1;
}
// 生成下一个订单 id（当前最大 id + 1）
function nextOrderId() {
  var max = 0;
  loadOrders().forEach(function (o) { if (o.id > max) max = o.id; });
  return max + 1;
}

// 清空本地数据，回到 seed 初始态
function resetDemo() {
  state.role = "consumer";
  state.cart = null; state.orders = null; state.idem = null;
  // 还原 SKU 库存/锁定库存（下单时 locked_stock 会被占位累加）
  MOCK_PRODUCTS.forEach(function (p, i) {
    p.skus.forEach(function (sku, j) {
      var pristine = MOCK_PRODUCTS_PRISTINE[i].skus[j];
      sku.stock = pristine.stock;
      sku.locked_stock = pristine.locked_stock;
    });
  });
  try {
    if (typeof localStorage !== "undefined") {
      [LS_KEY.role, LS_KEY.cart, LS_KEY.orders, LS_KEY.idem].forEach(function (k) { localStorage.removeItem(k); });
    }
  } catch (e) { /* ignore */ }
}

// 加购：校验 SKU 与可售库存，已有条目则累加数量；返回 {ok} 或 {error}
function addToCart(skuId, quantity) {
  var sku = findSku(skuId);
  if (!sku) return { error: "SKU 不存在" };
  var product = findProductBySku(sku.id);
  var avail = skuAvailable(sku);
  var qty = Math.max(1, Math.floor(Number(quantity)) || 1);
  var cart = loadCart();
  var existing = null;
  for (var i = 0; i < cart.length; i++) { if (cart[i].sku_id === sku.id) { existing = cart[i]; break; } }
  var baseQty = existing ? existing.quantity : 0;
  if (baseQty + qty > avail) return { error: "库存不足（stock is insufficient），可售 " + avail + " 件" };
  if (existing) {
    existing.quantity = baseQty + qty;
  } else {
    cart.push({
      id: nextCartId(), product_id: product.id, sku_id: sku.id, quantity: qty, selected: true,
      product_title: product.title, sku_name: sku.sku_name, price_cent: sku.price_cent, stock: avail,
    });
  }
  saveCart();
  return { ok: true };
}

// 更新购物车条目（数量/勾选），数量受可售库存约束；返回 {ok} 或 {error}
function updateCartItem(id, patch) {
  var item = null;
  var cart = loadCart();
  for (var i = 0; i < cart.length; i++) { if (cart[i].id === Number(id)) { item = cart[i]; break; } }
  if (!item) return { error: "购物车条目不存在" };
  if (patch.quantity != null) {
    var q = Math.max(1, Math.floor(Number(patch.quantity)) || 1);
    var sku = findSku(item.sku_id);
    var avail = sku ? skuAvailable(sku) : item.stock;
    if (q > avail) return { error: "库存不足（stock is insufficient），可售 " + avail + " 件" };
    item.quantity = q;
  }
  if (patch.selected != null) item.selected = !!patch.selected;
  saveCart();
  return { ok: true };
}

// 按条目 id 从购物车删除并持久化
function removeCartItem(id) {
  var cart = loadCart();
  state.cart = cart.filter(function (i) { return i.id !== Number(id); });
  saveCart();
}

// 汇总购物车：总件数、勾选件数、勾选数量与勾选金额（分）
function cartSummary() {
  var items = loadCart();
  var sel = items.filter(function (i) { return i.selected; });
  return {
    total_quantity: items.reduce(function (s, i) { return s + i.quantity; }, 0),
    selected_item_count: sel.length,
    selected_quantity: sel.reduce(function (s, i) { return s + i.quantity; }, 0),
    selected_amount_cent: sel.reduce(function (s, i) { return s + i.price_cent * i.quantity; }, 0),
  };
}

// 结算预览（对应 /api/orders/preview）：勾选条目 + 库存检查
function checkoutPreview() {
  var items = loadCart().filter(function (i) { return i.selected; });
  var stockOk = true;
  items.forEach(function (item) {
    var sku = findSku(item.sku_id);
    var avail = sku ? skuAvailable(sku) : item.stock;
    if (item.quantity > avail) stockOk = false;
  });
  return {
    merchant_id: MOCK_MERCHANT.id,
    items: items,
    stock_ok: stockOk,
    pay_amount_cent: cartSummary().selected_amount_cent,
  };
}

// 幂等下单：同一 idempotency_key 只允许创建一个订单（对应 uk_user_idempotency_key 唯一约束）。
// 成功后会扣减对应 SKU 可售库存（locked_stock 占位增量），并清空勾选条目。
function createOrder(input) {
  var idem = loadIdem();
  var key = input.idempotency_key;
  if (idem[key] != null) {
    var dup = findOrder(idem[key]);
    return { duplicate: true, order: dup };
  }
  var items = loadCart().filter(function (i) { return i.selected; });
  if (!items.length) return { error: "没有勾选任何商品" };
  for (var i = 0; i < items.length; i++) {
    var sku = findSku(items[i].sku_id);
    if (!sku || items[i].quantity > skuAvailable(sku)) {
      return { error: "库存不足（stock is insufficient）" };
    }
  }
  var total = items.reduce(function (s, it) { return s + it.price_cent * it.quantity; }, 0);
  var orderId = nextOrderId();
  var order = {
    id: orderId,
    order_no: "RCDEMO" + String(orderId).padStart(7, "0"),
    user_id: DEMO_ACCOUNTS.consumer.id,
    merchant_id: MOCK_MERCHANT.id,
    status: "CREATED",
    total_amount_cent: total, pay_amount_cent: total, discount_amount_cent: 0,
    idempotency_key: key,
    receiver_name: input.receiver_name, receiver_phone: input.receiver_phone, receiver_address: input.receiver_address,
    paid_at: null, cancelled_at: null, shipped_at: null, finished_at: null,
    created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
    items: items.map(function (it) {
      return { product_title: it.product_title, sku_name: it.sku_name, price_cent: it.price_cent, quantity: it.quantity, total_amount_cent: it.price_cent * it.quantity };
    }),
    events: [{ from_status: null, to_status: "CREATED", event_type: "ORDER_CREATED", operator_role: "consumer", operator_id: DEMO_ACCOUNTS.consumer.id, remark: "demo order created", created_at: new Date().toISOString() }],
    inventory_locks: items.map(function (it) {
      return { sku_id: it.sku_id, quantity: it.quantity, status: "locked", locked_at: new Date().toISOString() };
    }),
  };
  // 占位库存锁定：locked_stock 增加（演示层模拟）
  items.forEach(function (it) {
    var sku = findSku(it.sku_id);
    if (sku) sku.locked_stock += it.quantity;
  });
  // 移除已下单条目
  var cart = loadCart();
  state.cart = cart.filter(function (i) { return !i.selected; });
  saveCart();

  var orders = loadOrders();
  orders.unshift(order);
  saveOrders();
  idem[key] = order.id;
  saveIdem();
  return { duplicate: false, order: order };
}

// 按 id 查找订单，未找到返回 null
function findOrder(id) {
  var orders = loadOrders();
  for (var i = 0; i < orders.length; i++) { if (orders[i].id === Number(id)) return orders[i]; }
  return null;
}

// 向订单追加一条状态事件（消费者视角的操作者信息）
function pushEvent(order, from, to, type, remark) {
  order.events.push({
    from_status: from, to_status: to, event_type: type,
    operator_role: "consumer", operator_id: DEMO_ACCOUNTS.consumer.id,
    remark: remark, created_at: new Date().toISOString(),
  });
}

// 订单状态机（枚举与 backend/internal/order/domain/order_status.go、app.ts 一致）
function payOrder(id) {
  var order = findOrder(id);
  if (!order) return { error: "订单不存在" };
  if (order.status !== "CREATED") return { error: "仅待支付订单可支付" };
  order.status = "PAID"; order.paid_at = new Date().toISOString(); order.updated_at = order.paid_at;
  pushEvent(order, "CREATED", "PAID", "ORDER_PAID", "demo paid");
  order.inventory_locks.forEach(function (lock) { if (lock.status === "locked") lock.status = "confirmed"; });
  saveOrders();
  return { ok: true, order: order };
}
function cancelOrder(id) {
  var order = findOrder(id);
  if (!order) return { error: "订单不存在" };
  if (order.status !== "CREATED") return { error: "仅待支付订单可取消" };
  order.status = "CANCELLED"; order.cancelled_at = new Date().toISOString(); order.updated_at = order.cancelled_at;
  pushEvent(order, "CREATED", "CANCELLED", "ORDER_CANCELLED", "demo cancelled");
  order.inventory_locks.forEach(function (lock) { if (lock.status === "locked") lock.status = "released"; });
  saveOrders();
  return { ok: true, order: order };
}
function requestRefund(id, reason) {
  var order = findOrder(id);
  if (!order) return { error: "订单不存在" };
  if (order.status !== "PAID" && order.status !== "SHIPPED") return { error: "当前状态不支持退款申请" };
  order.status = "REFUNDING"; order.updated_at = new Date().toISOString();
  pushEvent(order, order.status === "PAID" ? "PAID" : "SHIPPED", "REFUNDING", "ORDER_REFUND_REQUESTED", reason || "体验不符");
  saveOrders();
  return { ok: true, order: order };
}
function finishOrder(id) {
  var order = findOrder(id);
  if (!order) return { error: "订单不存在" };
  if (order.status !== "SHIPPED") return { error: "仅已发货订单可确认收货" };
  order.status = "FINISHED"; order.finished_at = new Date().toISOString(); order.updated_at = order.finished_at;
  pushEvent(order, "SHIPPED", "FINISHED", "ORDER_FINISHED", "demo finished");
  saveOrders();
  return { ok: true, order: order };
}

/* =====================================================================
 * 5. A2UI 智能导购：上下文富化 + NDJSON 指令生成
 *    富化逻辑对应 service_ai.go enrichA2UIContext / parseBudgetFromIntent / inferSceneFromIntent；
 *    指令结构对应 backend/internal/ai/mock_provider.go。
 * ===================================================================== */

var A2UI_CATALOG_BASIC = "https://a2ui.org/specification/v0_9/catalogs/basic/catalog.json";
var A2UI_CATALOG_REDCART = "https://redcart.example/a2ui/catalog/v1";
var A2UI_PRIMARY = "#00BFFF";

// 从意图中解析预算（元/百 -> 分）；与 service_ai.go budgetRegex 语义一致
function parseBudgetFromIntent(intent) {
  var m = String(intent || "").toLowerCase().match(/(\d+)\s*(百|元|块|rmb|yuan)?/);
  if (!m) return 0;
  var num = parseInt(m[1], 10);
  if (Number.isNaN(num)) return 0;
  if (m[2] === "百") return num * 100 * 100;
  return num * 100;
}

// 从意图文本推断场景：宿舍 / 通勤办公 / 出行 / 通用
function inferSceneFromIntent(intent) {
  var t = String(intent || "").toLowerCase();
  if (t.indexOf("宿舍") >= 0) return "dorm_desk";
  if (t.indexOf("通勤") >= 0 || t.indexOf("办公") >= 0) return "office_desk";
  if (t.indexOf("出行") >= 0 || t.indexOf("旅行") >= 0) return "travel";
  return "general";
}

// 场景枚举 → 中文导购标题，未知场景用通用标题
function sceneTitle(scene) {
  var map = { dorm_desk: "宿舍书桌改造方案", office_desk: "通勤办公桌面方案", travel: "出行收纳方案" };
  return map[scene] || "智能导购专题";
}

// 与 service_ai.go relatedNotes 一致：返回挂载了指定商品的笔记（最多 4 条）
function relatedNotesFor(productIds) {
  var wanted = {};
  productIds.forEach(function (id) { wanted[id] = true; });
  var out = [];
  for (var i = 0; i < MOCK_NOTES.length; i++) {
    var note = MOCK_NOTES[i];
    var hit = note.product_ids.some(function (p) { return wanted[p]; });
    if (hit) out.push({ id: note.id, title: note.title, view_count: note.view_count, like_count: note.like_count });
    if (out.length >= 4) break;
  }
  return out;
}

// 富化上下文：预算命中时注入预算内商品/相关笔记/批量加购候选（对应 enrichA2UIContext）
function enrichA2UIContext(context, intent) {
  var ctx = {};
  Object.keys(context || {}).forEach(function (k) { ctx[k] = context[k]; });
  var budget = parseBudgetFromIntent(intent);
  if (ctx.budget != null) {
    var b = Number(ctx.budget);
    if (!Number.isNaN(b)) budget = b;
  }
  if (budget <= 0) return ctx; // 无导购信号：保持原上下文（mock 将生成问候界面）
  var filtered = MOCK_PRODUCTS.filter(function (p) {
    return productMinPrice(p) > 0 && productMinPrice(p) <= budget;
  });
  var productIds = filtered.map(function (p) { return p.id; });
  // 与 service_ai.go 一致：batch_cart_items 的 sku_id 简化为商品 id
  var batchItems = filtered.map(function (p) {
    return { product_id: p.id, sku_id: p.id, title: p.title };
  });
  ctx.budget = budget;
  ctx.products = filtered;
  ctx.related_notes = relatedNotesFor(productIds);
  ctx.batch_cart_items = batchItems;
  if (ctx.scene == null) ctx.scene = inferSceneFromIntent(intent);
  return ctx;
}

// 与 mock_provider.go normalizeProducts/normalizeNotes 一致：价格换算分->元，卖点拼接
function normalizeProducts(list) {
  return (list || []).map(function (p) {
    return {
      id: p.id, title: p.title, cover_url: p.cover_url,
      price_yuan: fmtYuan(productMinPrice(p)),
      selling_points: (p.selling_points || []).join(" · "),
      sku_id: p.id,
    };
  });
}
// 笔记标准化：映射为 A2UI 数据模型字段（id/标题/浏览/点赞）
function normalizeNotes(list) {
  return (list || []).map(function (n) {
    return { id: n.id, title: n.title, view_count: Number(n.view_count) || 0, like_count: Number(n.like_count) || 0 };
  });
}

// 生成智能导购专题界面（三行 NDJSON），结构同 mock_provider.generateShoppingGuideSurface

    );

  components.push(
    { id: "product_section", component: "Column", children: ["product_section_title", "product_list"] },
    { id: "product_section_title", component: "Text", text: "精选商品", variant: "h3" },
    { id: "product_list", component: "List", children: { path: "/products", componentId: "product_card_template" } },
    { id: "product_card_template", component: "Card", child: "product_col" },
    { id: "product_col", component: "Column", children: ["product_image", "product_title", "product_price", "product_points", "add_to_cart_btn"] },
    { id: "product_image", component: "Image", url: { path: "cover_url" }, alt: { path: "title" } },
    { id: "product_title", component: "Text", text: { path: "title" }, variant: "h3" },
    { id: "product_price", component: "Text", text: { call: "formatString", args: { value: "¥${price_yuan}" } } },
    { id: "product_points", component: "Text", text: { path: "selling_points" } },
    { id: "add_to_cart_btn", component: "Button", text: "加入购物车", variant: "primary", action: { event: { name: "add_to_cart", context: { product_id: { path: "id" }, sku_id: { path: "sku_id" } } } } },
    { id: "batch_cart_row", component: "Row", children: ["batch_total_text", "batch_add_btn"] },

    { id: "batch_add_btn", component: "Button", text: "一键加购全部", variant: "primary", action: { event: { name: "add_all_to_cart", context: { items: { path: "/batch_cart_items" } } } } },
  );
  if (hasNotes) {
    components.push(
      { id: "notes_section", component: "Column", children: ["notes_section_title", "note_list"] },
      { id: "notes_section_title", component: "Text", text: "相关种草笔记", variant: "h3" },
      { id: "note_list", component: "List", children: { path: "/related_notes", componentId: "note_card_template" } },

  var dataModel = { budget: budget, products: products };
  if (hasNotes) dataModel.related_notes = notes;
  if (Array.isArray(ctx.batch_cart_items)) dataModel.batch_cart_items = ctx.batch_cart_items;

  var line1 = JSON.stringify({

// 统一入口：按富化后的上下文是否含商品，生成问候或导购界面
function buildA2UISurface(surfaceId, intent, context) {
  var ctx = enrichA2UIContext(context || {}, intent);
  var products = Array.isArray(ctx.products) ? ctx.products : [];
  if (products.length === 0) return { type: "greeting", lines: buildGreetingSurface(surfaceId, intent), ctx: ctx };
  return { type: "guide", lines: buildGuideSurface(surfaceId, intent, ctx), ctx: ctx };
}

// 商家看板数据（口径与 backend/internal/redcart/application/service_dashboard.go 一致）
function deriveDashboard() {
  var products = MOCK_PRODUCTS;
  var orders = loadOrders();
  var summary = { product_count: 0, online_product_count: 0, order_count: 0, paid_order_count: 0, gmv_amount_cent: 0, refund_order_count: 0, inventory_warning_sku: 0 };
  products.forEach(function (p) {
    summary.product_count++;
    if (p.status === "online") summary.online_product_count++;
    p.skus.forEach(function (sku) { if (sku.stock <= 5) summary.inventory_warning_sku++; });
  });
  orders.forEach(function (o) {
    summary.order_count++;
    if (["PAID", "SHIPPED", "FINISHED", "REFUNDING", "REFUNDED"].indexOf(o.status) >= 0) {
      summary.paid_order_count++;
      summary.gmv_amount_cent += o.pay_amount_cent;
    }
    if (o.status === "REFUNDED" || o.status === "REFUNDING") summary.refund_order_count++;
  });
  var funnel = { note_views: 0, product_clicks: 0, add_to_cart: 0, order_create: 0, order_pay: 0, order_refund: 0 };
  MOCK_BEHAVIOR_EVENTS.forEach(function (e) {
    if (e.event_type === "NOTE_VIEW") funnel.note_views++;
    else if (e.event_type === "PRODUCT_CLICK") funnel.product_clicks++;
    else if (e.event_type === "ADD_TO_CART") funnel.add_to_cart++;
    else if (e.event_type === "ORDER_CREATE") funnel.order_create++;
    else if (e.event_type === "ORDER_PAY") funnel.order_pay++;
    else if (e.event_type === "ORDER_REFUND") funnel.order_refund++;
  });
  var stats = products.map(function (p) {
    var s = { id: p.id, title: p.title, status: p.status, exposure: 0, clicks: 0, add_to_cart: 0, orders: 0, paid: 0, refunds: 0, available_stock: p.skus.reduce(function (a, sku) { return a + sku.stock; }, 0) };
    MOCK_BEHAVIOR_EVENTS.forEach(function (e) {
      if (e.product_id !== p.id) return;
      if (e.event_type === "NOTE_VIEW") s.exposure++;
      else if (e.event_type === "PRODUCT_CLICK") s.clicks++;
      else if (e.event_type === "ADD_TO_CART") s.add_to_cart++;
      else if (e.event_type === "ORDER_CREATE") s.orders++;
      else if (e.event_type === "ORDER_PAY") s.paid++;
      else if (e.event_type === "ORDER_REFUND") s.refunds++;
    });
    return s;
  });
  // 商品级 GMV：与 summary.gmv 同口径（仅已支付口径订单：PAID/SHIPPED/FINISHED/REFUNDING/REFUNDED），
  // 按订单项小计归属到商品（order item 以 sku_name 反查商品，seed 中唯一）；订单级折扣按小计占比分摊，
  // 保证 Σ 商品 GMV === summary.gmv_amount_cent（本 demo 订单折扣恒为 0，即逐项小计相加）。
  var skuOwner = {};
  MOCK_PRODUCTS.forEach(function (p) { p.skus.forEach(function (s) { skuOwner[s.sku_name] = p.id; }); });
  var gmvByProduct = {};
  orders.forEach(function (o) {
    if (["PAID", "SHIPPED", "FINISHED", "REFUNDING", "REFUNDED"].indexOf(o.status) < 0) return;
    var oItems = o.items || [];
    var oTotal = oItems.reduce(function (a, it) { return a + Number(it.total_amount_cent || 0); }, 0);
    if (oTotal <= 0) return;
    oItems.forEach(function (it) {
      var pid = skuOwner[it.sku_name];
      if (pid == null) return;
      var share = Number(it.total_amount_cent || 0) / oTotal * Number(o.pay_amount_cent || 0);
      gmvByProduct[pid] = (gmvByProduct[pid] || 0) + share;
    });
  });
  stats.forEach(function (s) { s.gmv_cent = Math.round(gmvByProduct[s.id] || 0); });
  return { summary: summary, funnel: funnel, stats: stats };
}

// DOM 创建工具：props 支持 text/class/value 与普通属性，kids 支持文本与子元素
function h(tag, props, kids) {
  var el = document.createElement(tag);
  if (props) {
    Object.keys(props).forEach(function (key) {
      var value = props[key];
      if (value === null || value === undefined) return;
      if (key === "text") { el.textContent = value; return; }
      if (key === "class") { el.className = value; return; }
      if (key === "value") { el.value = value; return; }
      el.setAttribute(key, value);
    });
  }
  (kids || []).forEach(function (kid) {
    if (kid === null || kid === undefined) return;
    if (typeof kid === "string") el.appendChild(document.createTextNode(kid));
    else el.appendChild(kid);
  });
  return el;
}

var noticeTimer = null;
// 顶部通知条：按 level 区分样式，4.2 秒后自动消失
function setNotice(text, level) {
  var bar = document.querySelector(".notice");
  if (bar && bar.parentNode) bar.parentNode.removeChild(bar);
  if (!text) return;
  var main = document.getElementById("main");
  if (main) {
    var n = h("div", { class: "notice " + (level || "info"), text: text });
    main.insertBefore(n, main.firstChild);
  }
  if (noticeTimer) clearTimeout(noticeTimer);
  // 定时自动移除通知条
  noticeTimer = setTimeout(function () {
    var bar2 = document.querySelector(".notice");
    if (bar2 && bar2.parentNode) bar2.parentNode.removeChild(bar2);
  }, 4200);
}

/* =====================================================================
 * 7. A2UI 渲染器（移植自 frontend/src/app.ts a2uiRenderComponent）
 *    支持 Card/Column/Row/List/Text/Image/Slider/Button，路径取值、formatString 与动作绑定。
 * ===================================================================== */

// 按 "/" 路径从数据模型中取值，路径无效返回 undefined
function a2uiPath(dataModel, path) {
  if (path == null) return dataModel;
  var parts = String(path).split("/").filter(function (p) { return p; });
  var target = dataModel;
  for (var i = 0; i < parts.length; i++) {
    if (target == null || typeof target !== "object") return undefined;
    target = target[parts[i]];
  }
  return target;
}

// 解析 A2UI 值：字面量、{path} 路径引用与 formatString 模板
function a2uiValue(value, scope) {
  if (value == null) return "";
  if (typeof value === "object") {
    if (value.path) {
      var resolved = a2uiPath(scope, value.path);
      return resolved == null ? "" : String(resolved);
    }
    if (value.call === "formatString" && value.args && value.args.value) {
      return String(value.args.value).replace(/\$\{([^}]+)\}/g, function (_, expr) {
        var r = a2uiPath(scope, expr);
        return r == null ? "" : String(r);
      });
    }
  }
  return String(value);
}

// 解析动作上下文：逐键将值经 a2uiValue 解析为字符串
function a2uiActionContext(context, scope) {
  if (!context || typeof context !== "object") return {};
  var out = {};
  Object.keys(context).forEach(function (k) { out[k] = a2uiValue(context[k], scope); });
  return out;
}

// 把「商品 id 型 sku_id」映射到该商品真实在售 SKU（见文件头说明）
function resolveSkuFor(productId, skuId) {
  var product = findProduct(productId);
  if (!product) return null;
  if (skuId && product.skus.some(function (s) { return s.id === Number(skuId); })) return findSku(Number(skuId));
  return product.skus.find(function (s) { return s.status === "active" && skuAvailable(s) > 0; }) || product.skus[0] || null;
}

// 解析组件 children/child 引用并递归渲染子节点
function a2uiChildren(surface, comp, scope) {
  // children 与 child 均缺失才返回空；否则 Card 等以 child 引用子组件的容器会被提前短路而渲染为空壳
  if (comp.children == null && comp.child == null) return [];
  if (Array.isArray(comp.children)) {
    return comp.children.map(function (id) { return a2uiNode(surface, surface.components.get(id), scope); }).filter(Boolean);
  }
  if (comp.child) {
    var child = a2uiNode(surface, surface.components.get(comp.child), scope);
    return child ? [child] : [];
  }
  return [];
}

// A2UI 组件渲染器：Card/Column/Row/List/Text/Image/Slider/Button 与动作绑定
function a2uiNode(surface, comp, scope) {
  if (!comp) return h("span");
  var dataModel = scope || surface.dataModel;
  var children = a2uiChildren(surface, comp, dataModel);

  if (comp.component === "Card") {
    var card = h("section", { class: "card a2ui-card" });
    if (children[0]) card.appendChild(children[0]);
    return card;
  }
  if (comp.component === "Column") {
    var col = h("div", { class: "a2ui-column" });
    children.forEach(function (c) { col.appendChild(c); });
    return col;
  }
  if (comp.component === "Row") {
    var row = h("div", { class: "a2ui-row" });
    children.forEach(function (c) { row.appendChild(c); });
    return row;
  }
  if (comp.component === "List") {
    var list = h("div", { class: "a2ui-list" });
    var childDesc = comp.children;
    if (childDesc && typeof childDesc === "object" && childDesc.path && childDesc.componentId) {
      var items = a2uiPath(dataModel, childDesc.path) || [];
      var template = surface.components.get(childDesc.componentId);
      items.forEach(function (item) {
        var itemScope = Object.assign({ __parent: dataModel }, item);
        var rendered = a2uiNode(surface, template, itemScope);
        if (rendered) list.appendChild(rendered);
      });
    } else if (Array.isArray(childDesc)) {
      children.forEach(function (c) { list.appendChild(c); });
    }
    return list;
  }
  if (comp.component === "Text") {
    return h("div", { class: "a2ui-text " + (comp.variant || ""), text: a2uiValue(comp.text, dataModel) });
  }
  if (comp.component === "Image") {
    // 封面：seed cover_url 为占位域名，离线环境改为本地渐变占位图，保证零网络请求
    var url = a2uiValue(comp.url, dataModel);
    var alt = a2uiValue(comp.alt, dataModel) || "product";
    if (/^https?:\/\//.test(url)) {
      var g = ((Number(alt.length) || 1) % 5) + 1;
      return h("div", { class: "cover g" + g }, [h("div", { text: String(alt).slice(0, 2) })]);
    }
    var img = h("img", { class: "a2ui-image", src: url, alt: alt });
    // 图片加载失败时隐藏（离线占位图兜底）
    img.onerror = function () { img.style.display = "none"; };
    return img;
  }
  if (comp.component === "Slider") {
    var wrap = h("div", { class: "a2ui-slider-wrap" });
    var max = Number(comp.max) || 100;
    var slider = h("input", { type: "range", min: String(comp.min || 0), max: String(max), value: String(a2uiValue(comp.value, dataModel) || max) });
    var label = h("span", { class: "a2ui-slider-label", text: slider.value });
    // 滑块输入：更新标签并回写数据模型路径后刷新 surface
    slider.addEventListener("input", function () {
      label.textContent = slider.value;
      if (comp.value && comp.value.path) {
        var parts = String(comp.value.path).split("/").filter(function (p) { return p; });
        var target = surface.dataModel;
        parts.slice(0, -1).forEach(function (part) {
          if (!target[part]) target[part] = {};
          target = target[part];
        });
        if (parts.length > 0) target[parts[parts.length - 1]] = Number(slider.value);
        surface.refresh();
      }
    });
    wrap.appendChild(slider);
    wrap.appendChild(label);
    return wrap;
  }
  if (comp.component === "Button") {
    var btn = h("button", { class: "btn " + (comp.variant === "primary" ? "primary" : ""), text: a2uiValue(comp.text, dataModel) });
    if (comp.action) {
      if (comp.action.event) {
        var eventName = comp.action.event.name;
        var context = a2uiActionContext(comp.action.event.context, dataModel);
        // 按钮 A2UI 事件分发：add_to_cart / add_all_to_cart / a2ui_ack 等
        btn.addEventListener("click", function () {
          if (eventName === "add_to_cart") {
            var sku = resolveSkuFor(Number(context.product_id), Number(context.sku_id));
            var result = sku ? addToCart(sku.id, 1) : { error: "SKU 不存在" };
            setNotice(result.ok ? "已加入购物车" : (result.error || "加购失败"), result.ok ? "ok" : "error");
          } else if (eventName === "add_all_to_cart") {
            var items = [];
            if (comp.action.event.context && comp.action.event.context.items && comp.action.event.context.items.path) {
              items = a2uiPath(dataModel, comp.action.event.context.items.path) || [];
            }
            if (!items.length) { setNotice("没有可批量加购的商品", "info"); return; }
            var failCount = 0;
            items.forEach(function (item) {
              var sku2 = resolveSkuFor(Number(item.product_id), Number(item.sku_id));
              var r = sku2 ? addToCart(sku2.id, 1) : { error: "SKU 不存在" };
              if (!r.ok) failCount++;
            });
            setNotice(failCount ? ("部分商品加购失败（" + failCount + " 件）") : "全部商品已加入购物车", failCount ? "error" : "ok");
          } else if (eventName === "a2ui_ack") {
            surface.dataModel.acknowledged = true;
            setNotice("A2UI 已确认（a2ui_ack）", "info");
          } else {
            setNotice("A2UI action: " + eventName, "info");
          }
        });
      } else if (comp.action.functionCall) {
        var call = comp.action.functionCall.call;
        var args = a2uiActionContext(comp.action.functionCall.args, dataModel);
        // 按钮函数调用动作：openUrl 站内 hash 跳转或站外新窗口
        btn.addEventListener("click", function () {
          if (call === "openUrl") {
            var url = args.url || "";
            if (url.indexOf("#") === 0) go(url.slice(1));
            else if (url) window.open(url, "_blank");
          } else {
            setNotice("A2UI function: " + call, "info");
          }
        });
      }
    }
    return btn;
  }
  return h("div", { class: "a2ui-unknown muted", text: "未知组件: " + comp.component });
}

// 创建 A2UI surface（组件表 + 数据模型 + 刷新钩子）
function makeSurface(surfaceId) {
  return { surfaceId: surfaceId, components: new Map(), dataModel: {}, refresh: null };
}

// 逐行解析 NDJSON 指令并应用（createSurface / updateComponents / updateDataModel）
function applySurfaceLine(surface, line) {
  var envelope = JSON.parse(line);
  if (envelope.createSurface) {
    surface.dataModel = {};
  } else if (envelope.updateComponents) {
    (envelope.updateComponents.components || []).forEach(function (component) {
      surface.components.set(component.id, component);
    });
  } else if (envelope.updateDataModel) {
    var path = envelope.updateDataModel.path || "/";
    var parts = path.split("/").filter(function (p) { return p; });
    var target = surface.dataModel;
    parts.slice(0, -1).forEach(function (part) {
      if (!target[part]) target[part] = {};
      target = target[part];
    });
    if (parts.length === 0) surface.dataModel = envelope.updateDataModel.value;
    else target[parts[parts.length - 1]] = envelope.updateDataModel.value;
  }
}

  function loadPreview() {
    previewBox.innerHTML = "";
    var preview = checkoutPreview();
    if (!preview.items.length) {
      previewBox.appendChild(emptyBlock("没有勾选的商品，请先回到购物车勾选。"));
      return;
    }
    var panel = h("section", { class: "panel" });
    var table = h("table", { class: "tbl" });
    table.appendChild(h("thead", {}, [h("tr", {}, [
      h("th", { text: "商品" }), h("th", { text: "SKU" }), h("th", { text: "单价" }),
      h("th", { text: "数量" }), h("th", { text: "小计" }),
    ])]));
    var tbody = h("tbody");
    preview.items.forEach(function (item) {
      tbody.appendChild(h("tr", {}, [
        h("td", { text: PRODUCT_CN[item.product_id] || item.product_title }),
        h("td", { text: item.sku_name }),
        h("td", { text: formatMoney(item.price_cent) }),
        h("td", { text: String(item.quantity) }),
        h("td", { text: formatMoney(item.total_amount_cent || item.price_cent * item.quantity) }),
      ]));
    });
    table.appendChild(tbody);
    panel.appendChild(table);
    panel.appendChild(h("div", { class: "summary-bar" }, [
      h("div", { text: "商家 ID " + preview.merchant_id + " · 库存检查 " + (preview.stock_ok ? "通过" : "失败") }),
      h("div", { class: "summary-money", text: "应付 " + formatMoney(preview.pay_amount_cent) }),
    ]));
    previewBox.appendChild(panel);
  }

  // 提交订单：幂等键防重复，重复提交被拦截并返回原订单
  function submitOrder(forceKey) {
    message.style.display = "none";
    var key = forceKey || idemKey;
    var result = createOrder({
      receiver_name: receiverName.value,
      receiver_phone: receiverPhone.value,
      receiver_address: receiverAddress.value,
      idempotency_key: key,
    });
    if (result.error) {
      message.textContent = result.error;
      message.style.display = "";
      return { ok: false };
    }
    if (result.duplicate) {
      // 幂等拦截：同一幂等键已创建过订单，未重复创建
      setNotice("检测到重复提交（幂等键 " + key + "），已返回原订单，未重复创建。", "info");
      resultBox.innerHTML = "";
      resultBox.appendChild(h("div", { class: "idem-panel" }, [
        h("div", { text: "已拦截重复提交：幂等键 " + key + " 对应订单 #" + result.order.id + "（" + result.order.order_no + "）" }),
        h("div", { class: "actions" }, [h("button", { class: "btn mini", text: "查看订单" }, )]),
      ]));
      // 跳转到原订单详情
      resultBox.querySelector("button").addEventListener("click", function () { go("/orders/" + result.order.id); });
      return { ok: true, duplicate: true };
    }
    setNotice("订单已创建，可继续支付或取消。", "ok");
    resultBox.innerHTML = "";
    var panel = h("div", { class: "idem-panel" });
    panel.appendChild(h("div", { text: "订单 " + result.order.order_no + " 已创建（#" + result.order.id + "，应付 " + formatMoney(result.order.pay_amount_cent) + "）" }));
    panel.appendChild(h("div", { class: "muted", text: "本次幂等键: " + key }));
    panel.appendChild(h("div", { class: "muted", text: "后端通过 uk_user_idempotency_key 唯一约束保证：同一幂等键重复提交不会创建第二个订单。" }));
    var goOrder = h("button", { class: "btn primary mini", text: "查看订单" });
    // 跳转到新订单详情
    goOrder.addEventListener("click", function () { go("/orders/" + result.order.id); });
    var retryIdem = h("button", { class: "btn mini", text: "用同一幂等键再次提交（应被拦截）" });
    // 用同一幂等键再次提交，验证幂等拦截
    retryIdem.addEventListener("click", function () { submitOrder(key); });
    panel.appendChild(h("div", { class: "actions" }, [goOrder, retryIdem]));
    resultBox.appendChild(panel);
    return { ok: true };
  }

  var formPanel = h("section", { class: "panel" });
  formPanel.appendChild(formRow("收货人", receiverName));
  formPanel.appendChild(formRow("手机号", receiverPhone));
  formPanel.appendChild(formRow("收货地址", receiverAddress));
  formPanel.appendChild(h("div", { class: "meta", text: "本次下单幂等键: " + idemKey }));
  formPanel.appendChild(message);

  var submit = h("button", { class: "btn primary", text: "提交订单" });
  // 提交订单：防双击连点（禁用按钮 + 350ms 延迟）
  submit.addEventListener("click", function () {
    if (submit.disabled) return; // 幂等保护：提交期间禁用按钮，防止双击连点
    submit.disabled = true;
    setTimeout(function () {
      submitOrder();
      submit.disabled = false;
    }, 350);
  });
  var reload = h("button", { class: "btn", text: "刷新预览" });
  // 重新渲染结算预览
  reload.addEventListener("click", loadPreview);
  formPanel.appendChild(h("div", { class: "actions" }, [submit, reload]));
  wrap.appendChild(formPanel);
  wrap.appendChild(resultBox);
  wrap.appendChild(previewBox);
  loadPreview();
  return wrap;
}

// 消费者订单操作：支付/取消（CREATED）、申请退款（PAID/SHIPPED）、确认收货（SHIPPED）——与 app.ts 一致
function consumerOrderActions(order, host, done) {
  if (order.status === "CREATED") {
    var pay = h("button", { class: "btn primary mini", text: "支付" });
    // 支付订单并刷新列表
    pay.addEventListener("click", function () {
      var r = payOrder(order.id);
      setNotice(r.ok ? "支付成功" : (r.error || "支付失败"), r.ok ? "ok" : "error");
      if (r.ok) done();
    });
    host.appendChild(pay);
    var cancel = h("button", { class: "btn danger mini", text: "取消" });
    // 取消订单并刷新列表
    cancel.addEventListener("click", function () {
      var r = cancelOrder(order.id);
      setNotice(r.ok ? "订单已取消" : (r.error || "取消失败"), r.ok ? "info" : "error");
      if (r.ok) done();
    });
    host.appendChild(cancel);
  }
  if (order.status === "PAID" || order.status === "SHIPPED") {
    var refund = h("button", { class: "btn danger mini", text: "申请退款" });
    // 申请退款（prompt 输入原因）并刷新
    refund.addEventListener("click", function () {
      var reason = prompt("退款原因", "体验不符");
      if (reason === null) return;
      var r = requestRefund(order.id, reason);
      setNotice(r.ok ? "退款申请已提交" : (r.error || "退款失败"), r.ok ? "info" : "error");
      if (r.ok) done();
    });
    host.appendChild(refund);
  }
  if (order.status === "SHIPPED") {
    var finish = h("button", { class: "btn mini", text: "确认收货" });
    // 确认收货并刷新
    finish.addEventListener("click", function () {
      var r = finishOrder(order.id);
      setNotice(r.ok ? "订单已完成" : (r.error || "确认失败"), r.ok ? "ok" : "error");
      if (r.ok) done();
    });
    host.appendChild(finish);
  }
}

// 订单状态步骤条：主路径 CREATED→PAID→SHIPPED→FINISHED，CANCELLED 与 REFUNDING→REFUNDED 为分支态
// （状态定义与合法迁移见 backend/internal/order/domain/order_status.go）
function orderStatusPanel(order) {
  var panel = h("section", { class: "panel" });
  panel.appendChild(h("h3", { text: "订单状态流转" }));
  var MAIN = [
    { key: "CREATED", zh: "创建" },
    { key: "PAID", zh: "支付" },
    { key: "SHIPPED", zh: "发货" },
    { key: "FINISHED", zh: "完成" },
  ];
  var idxOf = {};
  MAIN.forEach(function (s, i) { idxOf[s.key] = i; });

  var done = {}, current = null, chain = null, branchFrom = null;
  var status = order.status;
  if (status === "CANCELLED") {
    // CREATED -> CANCELLED（终态，分支自 CREATED 之后）
    done["CREATED"] = true;
    chain = [{ key: "CANCELLED", zh: "已取消", cls: "branch-cancelled" }];
    branchFrom = "CREATED";
  } else if (status === "REFUNDING" || status === "REFUNDED") {
    // PAID/SHIPPED -> REFUNDING -> REFUNDED（分支自退款申请时的已达状态之后）
    var from = "PAID";
    (order.events || []).forEach(function (e) {
      if (e.event_type === "ORDER_REFUND_REQUESTED" && e.from_status && idxOf[e.from_status] != null) from = e.from_status;
    });
    var reached = idxOf[from];
    for (var i = 0; i <= reached; i++) done[MAIN[i].key] = true;
    branchFrom = from;
    chain = status === "REFUNDED"
      ? [{ key: "REFUNDING", zh: "退款中", cls: "branch-refunding" },
         { key: "REFUNDED", zh: "已退款", cls: "branch-refunded" }]
      : [{ key: "REFUNDING", zh: "退款中", cls: "branch-refunding" }];
  } else if (idxOf[status] != null) {
    var pos = idxOf[status];
    for (var j = 0; j < pos; j++) done[MAIN[j].key] = true;
    current = MAIN[pos];
  } else {
    current = MAIN[0];
  }

  var track = h("div", { class: "step-track" });
  MAIN.forEach(function (s, i) {
    var cls = done[s.key] ? "done" : (current && current.key === s.key ? "current" : "upcoming");
    var node = h("div", { class: "step-node " + cls });
    node.appendChild(h("div", { class: "step-dot", text: done[s.key] ? "✓" : (current && current.key === s.key ? String(i + 1) : "·") }));
    node.appendChild(h("div", { class: "step-label", text: s.zh }));
    node.appendChild(h("div", { class: "step-code", text: s.key }));
    track.appendChild(node);
    if (i < MAIN.length - 1) {
      // 只有跨过该连接（下一节点已完成）才着色，分支态不会错误点亮未经过的路径
      track.appendChild(h("div", { class: "step-link" + (done[MAIN[i + 1].key] ? " done" : "") }));
    }
  });
  panel.appendChild(track);
  // 分支态单独一行展示，避免在主路径末端引出误导性的虚线连接
  if (chain) {
    var note = status === "CANCELLED"
      ? "分支态：CREATED → CANCELLED（终态，未进入支付）"
      : (status === "REFUNDED"
        ? "分支态：" + branchFrom + " → REFUNDING → REFUNDED（终态）"
        : "分支态：" + branchFrom + " → REFUNDING（退款申请进行中）");
    var branchRow = h("div", { class: "step-branch" });
    branchRow.appendChild(h("span", { class: "step-branch-mark", text: "分支" }));
    chain.forEach(function (b, i) {
      if (i > 0) branchRow.appendChild(h("span", { class: "step-branch-arrow", text: "→" }));
      var last = i === chain.length - 1;
      var node = h("div", { class: "step-node branch " + b.cls + (last ? " current" : " done") });
      node.appendChild(h("div", { class: "step-dot", text: last ? "!" : "✓" }));
      node.appendChild(h("div", { class: "step-label", text: b.zh }));
      node.appendChild(h("div", { class: "step-code", text: b.key }));
      branchRow.appendChild(node);
    });
    branchRow.appendChild(h("div", { class: "step-branch-note muted", text: note }));
    panel.appendChild(branchRow);
  }
  return panel;
}

function a2uiView() {
  var wrap = h("div");
  wrap.appendChild(titleBar("A2UI 智能导购", "Agent-to-UI：输入意图与上下文，逐行输出 NDJSON 指令（createSurface / updateComponents / updateDataModel）并实时渲染卡片界面。"));

  var panel = h("section", { class: "panel" });
  var intentInput = h("input", { type: "text", value: "布置 10 平米宿舍书桌，预算 300" });
  var contextInput = h("textarea", { rows: "3" });
  contextInput.value = JSON.stringify({ budget: 30000, scene: "dorm_desk" });
  var message = h("div", { class: "error", style: "display:none" });
  var output = h("div");
  var surfaceHost = h("div", { class: "a2ui-surface" });

  panel.appendChild(formRow("意图", intentInput));
  panel.appendChild(formRow("上下文 JSON（可选，可留空）", contextInput));
  panel.appendChild(message);

  var loadExample = h("button", { class: "btn", text: "载入示例（宿舍 300 元）" });
  // 载入示例意图与上下文
  loadExample.addEventListener("click", function () {
    intentInput.value = "布置 10 平米宿舍书桌，预算 300";
    contextInput.value = JSON.stringify({ budget: 30000, scene: "dorm_desk" });
  });
  var runGuide = h("button", { class: "btn primary", text: "生成导购页" });
  // 生成导购页并流式渲染
  runGuide.addEventListener("click", function () { runA2UI("guide", intentInput, contextInput, message, output, surfaceHost); });
  var runGreeting = h("button", { class: "btn", text: "生成问候卡片" });
  // 生成问候卡片并流式渲染
  runGreeting.addEventListener("click", function () { runA2UI("greeting", intentInput, contextInput, message, output, surfaceHost); });
  panel.appendChild(h("div", { class: "actions" }, [runGuide, runGreeting, loadExample]));
  wrap.appendChild(panel);
  wrap.appendChild(output);
  wrap.appendChild(surfaceHost);

  var hint = h("div", { class: "idem-panel muted", text: "说明：生成导购页时按 service_ai.go 的逻辑解析预算（元/百 → 分）并筛选预算内商品；上下文无预算/无商品时退化为问候界面（mock_provider 行为）。" });
  wrap.appendChild(hint);
  return wrap;
}

// 逐行流式输出 NDJSON 并实时渲染 surface
function runA2UI(mode, intentInput, contextInput, message, output, surfaceHost) {
  message.style.display = "none";
  output.innerHTML = "";
  surfaceHost.innerHTML = "";

  var intent = intentInput.value;
  var context = {};
  if (mode === "guide" && String(contextInput.value || "").trim()) {
    try {
      context = JSON.parse(contextInput.value);
    } catch (e) {
      message.textContent = "上下文 JSON 解析失败";
      message.style.display = "";
      return;
    }
  }
  if (mode === "greeting") context = {};

  var surfaceId = (mode === "guide" ? "guide_surface_" : "greet_surface_") + Date.now();
  var built;
  try {
    built = buildA2UISurface(surfaceId, intent, context);
  } catch (e) {
    message.textContent = "生成失败: " + e.message;
    message.style.display = "";
    return;
  }

  var surface = makeSurface(surfaceId);
  // surface 刷新钩子：按 root 组件与数据模型重绘
  surface.refresh = function () {
    surfaceHost.innerHTML = "";
    var root = surface.components.get("root");
    if (root) surfaceHost.appendChild(a2uiNode(surface, root, surface.dataModel));
  };

  var terminal = h("div", { class: "terminal" });
  output.appendChild(h("div", { class: "meta", text: "surface: " + surfaceId + " · 指令数 3 · " + (built.type === "guide" ? "导购专题界面" : "问候界面") }));
  output.appendChild(terminal);
  var statusLine = h("div", { class: "term-status" });
  terminal.appendChild(statusLine);

  var lineNames = ["createSurface", "updateComponents", "updateDataModel"];
  var idx = 0;
  // 逐行输出 NDJSON 并应用：每行应用后刷新 surface，完成后渲染最终界面
  function emitNext() {
    if (idx >= built.lines.length) {
      statusLine.textContent = "✓ " + built.lines.length + " 条指令解析并应用，surface 已渲染（下方卡片）。";
      surface.refresh();
      return;
    }
    var line = built.lines[idx];
    var lineBox = h("div", { class: "term-line" });
    lineBox.appendChild(h("div", { class: "term-meta", text: (idx + 1) + "/3 · " + lineNames[idx] + " · v0.9" }));
    var pre = h("pre");
    pre.textContent = line;
    lineBox.appendChild(pre);
    terminal.insertBefore(lineBox, statusLine);
    try {
      applySurfaceLine(surface, line);
      lineBox.classList.add("applied");
    } catch (e) {
      lineBox.classList.add("applied");
    }
    statusLine.textContent = "已应用 " + lineNames[idx] + "，正在渲染...";
    // 每行指令应用后即刷新，呈现"实时渲染"效果
    if (surface.components.get("root")) surface.refresh();
    idx++;
    setTimeout(emitNext, 260);
  }
  emitNext();
}

// 应用启动：构建顶栏/导航/主区域，渲染首屏并监听 hash 变化
function boot() {
  appRoot = document.getElementById("app");
  var topbar = h("header", { class: "topbar" });
  topbar.id = "topbar";
  var layout = h("div", { class: "layout" });
  var nav = h("nav", { class: "nav" });
  nav.id = "nav";
  var main = h("main", { class: "main" });
  main.id = "main";
  layout.appendChild(nav);
  layout.appendChild(main);
  appRoot.appendChild(topbar);
  appRoot.appendChild(layout);
  renderShell();
  renderRoute();
  // hash 变化：重绘导航与路由视图
  window.addEventListener("hashchange", function () { renderShell(); renderRoute(); });
}

if (typeof document !== "undefined" && document.getElementById("app")) {
  boot();
}
