services:
  postgres:
    image: postgres:16
    network_mode: host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: redcart
    command: ["postgres", "-p", "15432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 15432 -U postgres -d redcart"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    network_mode: host
    command: ["redis-server", "--port", "6380", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5

  pyroscope:
    image: grafana/pyroscope:latest
    network_mode: host

  ai-service:
    build:
      context: ./ai-service
    network_mode: host
    environment:
      AI_GRPC_HOST: 0.0.0.0
      AI_GRPC_PORT: 50051
    expose:
      - "50051"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import grpc; ch=grpc.insecure_channel('127.0.0.1:50051'); grpc.channel_ready_future(ch).result(timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5

  analytics-service:
    build:
      context: ./backend
    network_mode: host
    command: ["redcart-analytics"]
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:15432/redcart?sslmode=disable
      ANALYTICS_GRPC_PORT: 50052
    expose:
      - "50052"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 50052"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.3.1
    network_mode: host
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:19093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "127.0.0.1:19092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    network_mode: host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  grafana:
    image: grafana/grafana:latest
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  backend:
    build:
      context: ./backend
    network_mode: host
    environment:
      HTTP_PORT: 18081
      POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:15432/redcart?sslmode=disable
      REDIS_ADDR: 127.0.0.1:6380
      JWT_SECRET: ${JWT_SECRET:-local-development-only-jwt-key-change-me}
      JWT_ISSUER: redcart-copilot
      JWT_AUDIENCE: redcart-api
      AI_PROVIDER: grpc
      AI_GRPC_ADDR: 127.0.0.1:50051
      ANALYTICS_PROVIDER: grpc
      ANALYTICS_GRPC_ADDR: 127.0.0.1:50052
      KAFKA_BROKERS: 127.0.0.1:19092
      KAFKA_TOPIC: redcart.events
      PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS-http://127.0.0.1:4040}
      PYROSCOPE_APPLICATION_NAME: ${PYROSCOPE_APPLICATION_NAME-redcart.backend}
      PYROSCOPE_BASIC_AUTH_USER: ${PYROSCOPE_BASIC_AUTH_USER:-}
      PYROSCOPE_BASIC_AUTH_PASSWORD: ${PYROSCOPE_BASIC_AUTH_PASSWORD:-}
      PYROSCOPE_TENANT_ID: ${PYROSCOPE_TENANT_ID:-}
      PYROSCOPE_MUTEX_PROFILE_FRACTION: ${PYROSCOPE_MUTEX_PROFILE_FRACTION:-}
      PYROSCOPE_BLOCK_PROFILE_RATE: ${PYROSCOPE_BLOCK_PROFILE_RATE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      pyroscope:
        condition: service_started
      ai-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy

  backend-replica:
    build:
      context: ./backend
    network_mode: host
    environment:
      HTTP_PORT: 18082
      POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:15432/redcart?sslmode=disable
      REDIS_ADDR: 127.0.0.1:6380
      JWT_SECRET: ${JWT_SECRET:-local-development-only-jwt-key-change-me}
      JWT_ISSUER: redcart-copilot
      JWT_AUDIENCE: redcart-api
      AI_PROVIDER: grpc
      AI_GRPC_ADDR: 127.0.0.1:50051
      ANALYTICS_PROVIDER: grpc
      ANALYTICS_GRPC_ADDR: 127.0.0.1:50052
      KAFKA_BROKERS: 127.0.0.1:19092
      KAFKA_TOPIC: redcart.events
      PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS-http://127.0.0.1:4040}
      PYROSCOPE_APPLICATION_NAME: ${PYROSCOPE_APPLICATION_NAME-redcart.backend}
      PYROSCOPE_BASIC_AUTH_USER: ${PYROSCOPE_BASIC_AUTH_USER:-}
      PYROSCOPE_BASIC_AUTH_PASSWORD: ${PYROSCOPE_BASIC_AUTH_PASSWORD:-}
      PYROSCOPE_TENANT_ID: ${PYROSCOPE_TENANT_ID:-}
      PYROSCOPE_MUTEX_PROFILE_FRACTION: ${PYROSCOPE_MUTEX_PROFILE_FRACTION:-}
      PYROSCOPE_BLOCK_PROFILE_RATE: ${PYROSCOPE_BLOCK_PROFILE_RATE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      pyroscope:
        condition: service_started
      ai-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    network_mode: host
    volumes:
      - ./deploy/nginx/redcart.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - backend-replica

  frontend:
    build:
      context: ./frontend
    network_mode: host
    depends_on:
      - gateway
